meta:
  id: ex2-03
  title: 典型三居室新风量计算
  book_ref: 书稿2.3节；三居室为自拟示例
  rules: [JGJ/T 440-2018, GB/T 18883-2022]
module: ventrate
input:
  area_m2: 75
  floor_area_m2: 90
  height_m: 2.8
  occupants: 3
  outdoor_ppm: 400
  limit_ppm: 1000
  limit_ppm_source: GB/T 18883-2022 第4.2条、表1
  allowance: 0.05
  hcho_sensitivity: [0.8, 1.0, 1.2]
  bedrooms:
    - area_m2: 15
      height_m: 2.8
      occupants: 2
      activity: sleeping
      hcho_materials:
        - {ef_mg_m2_h: 0.12, area_m2: 10, source: '示例值，需作者确认'}
    - {area_m2: 10, height_m: 2.8, occupants: 1, activity: sedentary}
    - {area_m2: 10, height_m: 2.8, occupants: 0, activity: sedentary}
  living: {area_m2: 24, height_m: 2.8}
output: {markdown: true}
